<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--app-head-->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      No Content-Security-Policy <meta> on purpose: AdSense Auto ads and Funding
      Choices (consent) inject inline scripts and load scripts/frames from many,
      changing Google domains. A CSP strict enough to matter would break ads.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0A0F1A" />
    <script>
      (function () {
        try {
          var d = document.documentElement;
          d.setAttribute('data-js', '');
          var m = 'auto';
          try {
            var s = localStorage.getItem('theme');
            if (s === 'light' || s === 'dark' || s === 'auto') m = s;
          } catch (e) {}
          var r = m;
          if (m === 'auto') {
            r = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          d.setAttribute('data-theme', r);
          d.setAttribute('data-theme-mode', m);
          var t = document.querySelector('meta[name="theme-color"]');
          if (t) t.setAttribute('content', r === 'light' ? '#F6F7F9' : '#0A0F1A');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      />
    </noscript>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      Google Consent Mode v2. Defaults must run before gtag.js and adsbygoogle.js.
      EEA/UK/CH: everything denied until the Google CMP (loaded by the AdSense
      tag) reports a choice. Elsewhere: granted by default; US-state opt-outs
      are handled by the CMP's US-states message.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500,
        region: ['AT', 'BE', 'BG', 'HR', 'CY', 'CZ', 'DK', 'EE', 'FI', 'FR', 'DE', 'GR', 'HU', 'IS', 'IE', 'IT', 'LV', 'LI', 'LT', 'LU', 'MT', 'NL', 'NO', 'PL', 'PT', 'RO', 'SK', 'SI', 'ES', 'SE', 'GB', 'CH']
      });
      gtag('consent', 'default', {
        ad_storage: 'granted',
        ad_user_data: 'granted',
        ad_personalization: 'granted',
        analytics_storage: 'granted'
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', false);
    </script>

    <meta name="google-adsense-account" content="ca-pub-5076417401305199" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5076417401305199" crossorigin="anonymous"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PCZPZC1H5E"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-PCZPZC1H5E');
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
