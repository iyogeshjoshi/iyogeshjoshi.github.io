# deviloper.dev catalog: the single source of truth for every app on the hub (PRD §7).
#
# Validated at build time by src/catalog/schema.ts via scripts/vite-plugin-catalog.ts;
# any error fails `vite build` with the offending path (e.g. apps[2].description).
#
# Status rules:
#   live | beta | coming-soon  public. Needs a description of at least 150 words,
#                              3+ features and 3+ howTo steps; tagline at most 90 chars.
#   draft | private            NEVER shipped. Filtered out before the client bundle,
#                              pages, search and sitemaps are built. Short copy is fine.
#
# Other rules: slug is lowercase kebab-case and unique; url is https://<sub>.deviloper.dev
# and unique; tags 1-5; accent is a hex color; dates are YYYY-MM-DD. Set `sitemap` only
# when the subdomain serves a real sitemap (not a soft 404).

site:
  name: deviloper.dev
  tagline: Side projects, small tools & games.
  description: >-
    A growing collection of things I build in my spare time — free to use, no sign-up.
    Each one lives on its own deviloper.dev subdomain.
